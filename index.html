<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101215"><title>RangeTrack | CATM Qualification System</title><style>

:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#101215;--surface:#1c2025;--surface2:#252a30;--inset:#121519;--line:#3b4249;--text:#f3f5f4;--muted:#a8b1b7;--olive:#8ccf54;--olive-dark:#12331b;background:var(--bg);color:var(--text)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-size:14px;line-height:1.5}
.brand-header{background:#1a1e23;border-bottom:1px solid #41474b;padding:20px 24px}
.brand-inner{max-width:1240px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brand-text h1{font-size:32px;line-height:1;letter-spacing:-1px;margin:0 0 6px;font-weight:900}
.brand-text h1 span{color:var(--olive)}
.brand-sub{font-size:11px;font-weight:750;letter-spacing:2px;color:#b9c2bc}
main{max-width:1240px;margin:0 auto;padding:22px 18px 45px}
h2{font-size:21px;letter-spacing:-.35px;line-height:1.25;margin:0 0 12px;color:var(--text)}
h3{font-size:16px;margin:14px 0 9px}
p{margin:8px 0 13px}
.muted,.footer{color:var(--muted);font-size:13px}
.small{font-size:12px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin:0 0 16px;box-shadow:0 4px 18px #0003}
label{font-size:13px;color:#dce2dd;font-weight:650;display:grid;gap:6px}
input,select,textarea{width:100%;min-width:0;background:var(--inset);border:1px solid #515c62;border-radius:7px;color:var(--text);padding:11px;font:inherit;min-height:44px}
input[type=number]{font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #8cff70;outline-offset:2px}
input::placeholder{color:#7f898d}
button{font:inherit;font-size:13px;font-weight:750;min-height:43px;padding:10px 15px;border-radius:7px;border:1px solid #566064;background:#2b3338;color:var(--text);cursor:pointer}
button:hover:not(:disabled){background:#3a464a}
button.primary,button.active{background:var(--olive);border-color:#93ff80;color:#152012}
button.danger{background:#76383e;border-color:#ac656c;color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
.tabs{display:flex;gap:0;background:#1b2025;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:19px}
.tabs button{flex:1;background:transparent;color:#bec5c5;border:0;border-right:1px solid #343a40;border-radius:0;min-height:48px}
.tabs button:last-child{border-right:0}
.tabs button.active{background:#193922;color:#d4ffcf;border-bottom:3px solid var(--olive)}
.entry,.areaedit{background:#252b30;border:1px solid #40494f;padding:13px;border-radius:8px;margin-top:9px}
.tag{display:inline-block;padding:6px 10px;border-radius:5px;background:#153d20;border:1px solid #36e85b;color:#baffaa;font-size:12px;font-weight:800}
.notice{background:#383224;border:1px solid #786a47;border-radius:8px;padding:12px;font-size:13px;color:#eadbb5}
.dangerarea{border-color:#825157}
.weapons{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
.weapons button,.courses button{min-height:55px}
.selected{outline:2px solid var(--olive);outline-offset:-2px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scoretable{border-collapse:collapse;min-width:700px;width:100%}
.scoretable th,.scoretable td{border:1px solid #465056;padding:9px;text-align:left}
.scoretable th{background:#30383d}.scoretable td{background:#22282d}
.dynamic th small{display:block;font-size:10px;color:var(--muted)}
.scoretable input{max-width:110px}
.scoretable .cellfield{display:flex;align-items:center;justify-content:space-between;gap:7px;margin:5px 0}
.scoretable .cellfield span{color:var(--muted);font-size:11px}
.scoretable .overall{border-top:1px solid #424a50;margin-top:7px;padding-top:7px}
.calculated{font-weight:750;color:#e9f0d9}
.hint{margin:8px 0}.spacer{height:8px}
.dashboard-title{font-size:25px;margin:4px 0 20px}
.dashboard-section{margin-bottom:12px}
.dashboard-card{display:flex;align-items:center;text-align:left;gap:16px;min-height:93px;width:100%;background:#22282e;border:1px solid #4a565a;border-left:4px solid var(--olive);border-radius:9px;padding:16px 18px;color:var(--text)}
.dashboard-card:hover{background:#2a3238}
.dashboard-card .dash-icon{font-size:26px;color:var(--olive);min-width:38px;text-align:center}
.dashboard-card .dash-copy{flex:1}
.dashboard-card strong{display:block;font-size:17px}
.dashboard-card small{display:block;color:var(--muted);font-size:12px;font-weight:450;margin-top:5px}
.dashboard-card .dash-chevron{font-size:26px;color:var(--olive)}
.dashboard-selection{border-left:3px solid var(--olive);padding-left:12px}
.dashboard-action{width:100%;margin-top:10px}
.score-section{padding:19px 22px 14px;background:#20252b;border-top:3px solid var(--olive)}
.score-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score-head h2{font-size:25px;margin:0}
.score-head .muted{margin:5px 0 0}
.score-toolbar{display:flex;align-items:end;gap:13px;flex-wrap:wrap;margin:19px 0 9px}
.score-table-choose{flex:1;max-width:470px}
.score-table-choose select{font-size:15px;font-weight:750}
.score-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:11px 0}
.score-nav button{min-width:98px;max-width:170px;flex:1}
.score-nav span{color:#d8dfd8;font-weight:750;text-align:center}
.score-roster{display:grid;gap:10px;margin-bottom:16px}
.scorer-card{border:1px solid #444d53;border-radius:9px;background:#21272d;overflow:hidden;box-shadow:0 3px 12px #0003}
.scorer-person{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 17px;background:#292f35;border-bottom:1px solid #444d53}
.scorer-person strong{font-size:16px;letter-spacing:.02em}
.scorer-meta{font-size:12px;color:#b3bec2;margin-top:3px}
.scorer-status{font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap;padding:5px 9px;border:1px solid;border-radius:5px}
.status-pass{background:#273f30;border-color:#5c8263;color:#c3ecc9}
.status-fail{background:#4c2d34;border-color:#ae646d;color:#ffd3d9}
.status-pending{background:#443c28;border-color:#866f45;color:#f5e2b4}
.scorer-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;padding:15px 17px 6px}
.scorer-field{display:grid;gap:7px;font-size:12px;font-weight:750;color:#d5dde0}
.scorer-field input{font-size:21px;text-align:center;min-height:52px;background:#111519;color:#fff;font-weight:800}
.scorer-computed{display:flex;align-items:center;justify-content:center;background:#30373a;border:1px solid #58625f;border-radius:7px;min-height:52px;font-size:20px}
.scorer-metrics{display:flex;gap:12px 25px;flex-wrap:wrap;padding:10px 17px;color:#b2bdc0;font-size:12px}
.scorer-metrics strong{color:#f2f4f2}
.scorer-foot{border-top:1px solid #414a50;padding:11px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:#c5cecc}
.scorer-foot button{min-height:37px}
.refire-details{margin:8px 16px 12px;background:#332d27;border:1px solid #8b7251;border-radius:7px}
.refire-details summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:#f4dcae;padding:11px 13px;font-weight:800}
.refire-details[open] summary{border-bottom:1px solid #6e5c44}
.refire-details .scorer-fields{padding:12px}
.refire-details .scorer-metrics{padding:8px 12px}
.footer{text-align:center;border-top:1px solid #30383d;padding:20px 6px;color:#818c91}
@media(min-width:840px){.score-roster{grid-template-columns:repeat(2,minmax(0,1fr))}.score-section{padding:20px 25px}}
@media(max-width:650px){main{padding:11px 10px 30px}.brand-header{padding:17px 14px}.brand-text h1{font-size:29px}.panel{padding:14px}.tabs button{font-size:12px;padding:9px 5px}.score-section{padding:15px}.score-head h2{font-size:21px}.score-toolbar{display:block}.score-table-choose{max-width:none}.score-nav button{min-width:0;padding:8px 7px}.score-nav span{font-size:12px}.scorer-person{padding:12px}.scorer-person strong{font-size:15px}.scorer-fields{padding:12px 12px 3px;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.scorer-field input{font-size:22px;min-height:54px}.scorer-metrics{padding:9px 12px}.scorer-foot{padding:11px 12px}.scorer-foot button{width:100%}}
@media(max-width:360px){.scorer-fields{grid-template-columns:1fr}.scorer-status{font-size:10px}}
@media print{body{background:#fff;color:#171b1f}.brand-header,.footer,.tabs{display:none!important}main{max-width:none;padding:0}#app{display:block!important}.panel{box-shadow:none}.export-controls{display:none!important}#printReport{background:#fff;color:#171b1f!important} @page{size:landscape;margin:10mm}}


/* V25 scoring table layout: real table on desktop, compact score rows on phones. */
.score-section{padding:16px 20px}
.score-toolbar{display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:13px 0 4px}
.score-table-choose{width:min(360px,100%)}
.score-summary{display:flex;gap:18px;align-items:center;color:#b8c2c2;font-size:12px}
.score-summary strong{font-size:19px;color:#eff4e7;margin-right:4px}
.score-table-panel{padding:0;overflow:hidden}
.score-table-heading{display:flex;gap:12px;justify-content:space-between;align-items:center;background:#252b31;padding:15px 17px;border-bottom:1px solid #434b52}
.score-table-heading strong{font-size:16px}.score-table-heading span{font-size:12px;color:#b2bec0}
.score-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.range-scoring-table{width:100%;border-collapse:collapse;border-spacing:0;min-width:780px}
.range-scoring-table thead{background:#30363b}
.range-scoring-table th{text-align:center;padding:11px 9px;white-space:nowrap;font-size:12px;color:#dbe2de;font-weight:750;border-bottom:1px solid #4a5257}
.range-scoring-table th:first-child{text-align:left;min-width:158px}
.range-scoring-table td{padding:10px 8px;text-align:center;border-bottom:1px solid #3e474c;vertical-align:middle}
.range-scoring-table tbody tr:nth-child(even){background:#242a30}
.range-scoring-table tbody tr:last-child td{border-bottom:0}
.score-person-cell{text-align:left!important;min-width:148px}
.score-person-cell strong{display:block;color:#f5f7f4;font-size:13px}
.score-person-cell small,.score-course-cell small{display:block;font-size:11px;color:#aab7bc;margin-top:3px}
.score-area-cell{min-width:85px}
.table-field{display:block}
.table-field .mobile-area-label{display:none}
.table-field input{max-width:86px;width:100%;min-height:45px;padding:8px 5px;text-align:center;font-size:19px;font-weight:800}
.table-field .scorer-computed{min-height:45px;padding:7px}
.score-hits-cell{font-size:15px;color:#f6f8ef}
.score-result-cell{min-width:105px}
.score-result-cell .scorer-status{display:inline-block;padding:5px 8px}
.effective-result{font-size:10px;color:#aebbbb;margin-top:6px}
.effective-result strong{color:#dce8d5}
.score-course-cell strong{font-size:12px;color:#e8ede4}
.score-actions-cell{min-width:143px}
.remedial-button{font-size:11px;padding:7px 9px;min-height:35px;white-space:nowrap}
.refire-details{margin:9px 0 0;text-align:left;width:min(330px,100%);min-width:175px}
.refire-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:10px}
.refire-field-grid input{max-width:100%;min-width:0;font-size:18px;min-height:42px;text-align:center}
.refire-details .scorer-metrics{font-size:11px;display:flex;gap:7px}
.score-bottom .muted{margin-top:8px}
@media(max-width:700px){
 .score-toolbar{align-items:stretch}
 .score-summary{width:100%;justify-content:space-between;background:#252b30;border-radius:7px;padding:9px 12px;gap:5px}
 .score-table-scroll{overflow:visible}
 .range-scoring-table{display:block;min-width:0;width:100%}
 .range-scoring-table thead{display:none}
 .range-scoring-table tbody{display:grid;gap:9px;padding:10px}
 .range-scoring-table tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;overflow:hidden;border:1px solid #424c52;border-radius:8px;background:#242a30!important}
 .range-scoring-table td{display:block;border:0;text-align:left;padding:9px 10px;min-width:0}
 .range-scoring-table .score-person-cell{grid-column:1/-1;min-width:0;background:#30363c;border-bottom:1px solid #465057;padding:10px 12px}
 .score-person-cell strong{font-size:15px}
 .score-person-cell small{font-size:12px}
 .range-scoring-table .score-area-cell{min-width:0;padding:10px 7px 2px}
 .range-scoring-table .score-area-cell:nth-child(even){padding-left:12px}
 .range-scoring-table .score-area-cell:nth-child(odd){padding-right:12px}
 .table-field .mobile-area-label{display:block;margin-bottom:5px;font-size:11px;color:#c5d0d0;min-height:16px}
 .table-field input{max-width:none;width:100%;min-height:49px;font-size:21px}
 .range-scoring-table .score-hits-cell,.range-scoring-table .score-result-cell{padding:8px 12px;border-top:1px solid #374248}
 .score-hits-cell:before,.score-result-cell:before{content:attr(data-label);display:block;color:#9daeb5;font-size:10px;font-weight:650;margin-bottom:3px}
 .range-scoring-table .score-course-cell{grid-column:1/-1;border-top:1px solid #374248}
 .range-scoring-table .score-actions-cell{grid-column:1/-1;border-top:1px solid #454e54;padding:8px 12px}
 .score-actions-cell:empty{display:none}
 .remedial-button{width:auto;min-width:170px}
 .refire-details{min-width:0;width:100%;margin-top:3px}
 .refire-field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .score-table-panel{background:#1b2025}
 .score-table-heading{padding:11px 12px}
 .score-table-heading span{font-size:11px}
}


/* V25 Tactical Lime accent polish. Charcoal surfaces remain unchanged. */
:root{--accent:#8ccf54;--accent-soft:#c3e8a1;--accent-glow:rgba(140,207,84,.17)}
.brand-text h1 span{color:var(--accent);text-shadow:0 0 14px rgba(140,207,84,.12)}
button.primary,button.active{background:var(--accent);border-color:#addf84;color:#172112}
button.primary:hover:not(:disabled){background:#a1db6e;box-shadow:0 0 0 2px rgba(140,207,84,.12)}
.tabs button.active{background:#283c25;color:#d7efc0;border-bottom:3px solid var(--accent)}
.tag{background:#273b25;border-color:#6eac48;color:#cdf0b0}
.dashboard-card{border-left-color:var(--accent)}
.dashboard-card .dash-icon,.dashboard-card .dash-chevron{color:var(--accent)}
.scorer-field input:focus,.table-field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(140,207,84,.16)}
.score-section{border-top-color:var(--accent)}
.score-nav button.primary{background:var(--accent)}
.score-summary strong{color:#c3e8a1}
.score-table-heading strong{color:#c6e9a8}
button:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--accent)}
@media print{.report-preview,#printReport{box-shadow:none!important;text-shadow:none!important}}

/* V25.3: purpose-built dense class scoring grid, not the old responsive shooter cards */
.score-grid-header{padding:16px 20px 12px}
.score-grid-header .score-toolbar{justify-content:space-between;margin:11px 0 12px}
.score-grid-header .score-nav{margin:0;min-width:270px}
.score-nav-compact span{background:#2a3035;border:1px solid #414a50;padding:8px 13px;border-radius:6px;font-weight:850;white-space:nowrap}
.class-score-stats{display:flex;align-items:stretch;gap:18px;border-top:1px solid #414950;padding:12px 0 0;flex-wrap:wrap}
.class-score-stats>div:not(.class-auto-save){display:flex;align-items:baseline;gap:7px}
.class-score-stats b{font-size:20px;color:#8ccf54;line-height:1}
.class-score-stats span{font-size:12px;color:#b1bcc0}
.class-auto-save{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#aab6b5}
.live-save-dot{display:inline-block;width:7px;height:7px;background:#8ccf54;border-radius:50%}
.score-grid-panel{padding:0;overflow:hidden}
.score-grid-title{display:flex;justify-content:space-between;align-items:center;padding:13px 17px;gap:12px;background:#242a30;border-bottom:1px solid #454e53}
.score-grid-title strong{display:block;font-size:16px;color:#f4f7f2}
.score-grid-title small{display:block;font-size:11px;color:#b3bec2;margin-top:3px}
.score-grid-title>span{color:#aabcbe;font-size:12px}
.score-grid-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}
.score-grid-columns,.score-grid-row{display:grid;min-width:var(--score-min-width,790px);align-items:stretch}
.score-grid-columns{background:#32383e;border-bottom:1px solid #525c62}
.score-grid-columns>div{padding:12px 7px;text-align:center;color:#dce5dd;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1.2;border-right:1px solid #454e54}
.score-grid-columns>div:first-child{text-align:left;justify-content:flex-start;padding-left:15px}
.score-grid-shooter-group{display:block;background:#1d2227;border:0;border-bottom:1px solid #3d464b;border-radius:0;box-shadow:none;margin:0;padding:0}
.score-grid-shooter-group:nth-child(2n+1){background:#242a2f}
.score-grid-shooter-group:last-child{border-bottom:0}
.score-grid-row>div{min-width:0;border-right:1px solid #343d42;display:flex;align-items:center;justify-content:center;padding:9px 6px}
.score-grid-row>div:last-child{border-right:0}
.score-grid-row .grid-shooter{display:flex;align-items:flex-start;flex-direction:column;justify-content:center;padding-left:15px;gap:3px}
.grid-shooter strong{font-size:13px;color:#f2f5f1;line-height:1.3}
.grid-shooter small{font-size:10px;color:#8a969c;letter-spacing:.02em}
.grid-metadata{font-size:13px;color:#d2dcda}
.grid-input-cell{padding:7px 6px!important}
.grid-score-input{height:45px;min-height:45px;width:100%;max-width:92px;border:1px solid #556265;border-radius:6px;background:#11161a;color:#f3f6f3;font-size:19px;text-align:center;font-weight:800;padding:5px}
.grid-score-input:focus{border-color:#8ccf54;box-shadow:0 0 0 2px #8ccf5440}
.grid-calc{display:flex;align-items:center;justify-content:center;background:#2b3338;border:1px solid #465357;border-radius:6px;min-height:45px;width:100%;color:#dbe6d9;font-size:16px;font-weight:800}
.grid-hits strong{color:#dcecd2;font-size:16px}
.grid-result,.grid-overall{display:flex;flex-direction:column;gap:4px}
.grid-result small,.grid-overall small{font-size:10px;text-align:center;color:#abb9bb;line-height:1.2;overflow-wrap:anywhere}
.grid-result .scorer-status{font-size:10px;padding:5px 6px}
.grid-overall strong{font-size:16px;color:#f0f4f0}
.grid-remedial-bar{background:#1b2025;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:5px 12px 7px;border-top:1px solid #333c40}
.grid-remedial-bar span{font-size:10px;color:#a9b5b6}
.grid-remedial-bar button{font-size:10px;min-height:29px;padding:5px 10px}

.grid-refire summary span:last-child{color:#c1c9c1;font-size:11px}
.grid-refire[open] summary{border-bottom:1px solid #495645}
.refire-grid-scroll{overflow:visible}
.score-refire-row{background:#252c29}
.score-refire-row .grid-shooter strong{color:#bfe4a6}

.score-grid-caption{font-size:11px;padding:9px 15px;background:#1a1f24;border-top:1px solid #353e44;color:#9faeb2}
.score-grid-bottom .score-nav{max-width:510px;margin:0 auto}
@media(min-width:900px){.score-grid-scroll{overflow-x:auto}.score-grid-header{padding:17px 23px 13px}}
@media(max-width:700px){
 .score-grid-header{padding:14px}
 .score-grid-header .score-toolbar{display:grid;gap:11px}
 .score-grid-header .score-table-choose{width:100%;max-width:none}

</head><body><header class="brand-header"><div class="brand-inner"><div class="brand-text"><h1>RANGE<span>TRACK</span></h1><div class="brand-sub">CATM QUALIFICATION SYSTEM</div></div></div></header><main><div id="nav" class="tabs"></div><div id="app"></div><div class="footer">RangeTrack • Data stored locally on this device. Verify course standards and refire policy before operational use.</div></main><script>

const M18_DQC_ID='c-m18-dqc-preloaded';

 const area=(id,name,expert)=>({id,name,mode:'manual',sources:[],qual:'',expert,countScore:true});
 const table=(id,name,rounds,qualMin,expertTotal,vital,head)=>({
  id,name,rounds,qualMin,expertTotal,
  areas:[area(id+'-vital','Vital Area (10-inch)',vital),area(id+'-head','Head (6-inch)',head),area(id+'-outside','Outside Zones (Silhouette)','')],

  notes:'DAFMAN 31-131V2 para 19.3.4. Score each table cumulatively after all orders of fire. Expert requires every table to meet its Expert thresholds. Verify refire rules before operational use.',

const fresh=()=>({weapon:'',course:'',view:'home',sessions:{},courses:starterCourses(),editing:''});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem(PREV))||fresh()}catch{db=fresh()};if(!db.sessions)db=fresh();if(!Array.isArray(db.courses))db.courses=starterCourses();if(!db.editing)db.editing='';if(!Array.isArray(db.weapons))db.weapons=[...DEFAULT_WEAPONS];db.weapons=[...new Set(db.weapons.filter(w=>typeof w==='string'&&w.trim()).map(w=>w.trim()))];if(!localStorage.getItem(KEY)){const migrated={};for(const [k,s] of Object.entries(db.sessions)){const [w,name]=k.split('|');const c=db.courses.find(c=>c.name===name&&c.weapons.includes(w));if(c){s.template=JSON.parse(JSON.stringify(c));migrated[w+'|'+c.id]=s}else migrated[k]=s}db.sessions=migrated;db.course='';db.view='home'}

function normalizeTable(t){

db.courses.forEach(c=>{if((c.version||1)!==1||c.phases?.length!==3)return;const untouched=c.phases.every((t,i)=>t.name==='Phase '+(i+1)&&(!t.rounds||t.rounds==='')&&(!t.time||!t.time.enabled)&&(!t.areas||t.areas.length===4&&t.areas.map(a=>a.name).join('|')==='Head|Body|Exterior|Overall'&&t.areas.every(a=>a.qual===''&&a.expert==='')));if(untouched)c.phases=[{id:'p'+uid(),name:'Table 1',rounds:'',areas:[newArea('Scoring Area 1')],time:{enabled:false,seconds:''}}]});

 for(const t of s.template.phases||[]){const old=t.scoringPhases||[];
  if(old.length===1){for(const shooter of s.shooters||[]){for(const key of ['initialScores','refireScores']){const dest=shooter[key]||{};if(dest[old[0].id]&&!dest[t.id])dest[t.id]={...dest[old[0].id]};}}}
 }

const scoringPhases=t=>[t];
const phaseAsTable=(t,ph)=>t;
const areaValue=(record,table,area,seen=new Set())=>{if(!area||seen.has(area.id))return '';const raw=record?.[area.id];if(area.mode!=='sum')return raw==null?'':raw;const next=new Set(seen);next.add(area.id);const values=(area.sources||[]).map(id=>areaValue(record,table,table.areas.find(a=>a.id===id),next));return values.length&&values.every(v=>v!==''&&Number.isFinite(Number(v)))?values.reduce((sum,v)=>sum+Number(v),0):''};

function phaseNames(){return current()?.template?.phases?.map(p=>p.id)||phases().map(p=>p.id)};
function phaseTitle(id){return (current()?.template?.phases||phases()).find(p=>p.id===id)?.name||id};
function openCourse(){if(!db.weapon||!selectedCourse())return;const key=sessionKey();if(!db.sessions[key]){db.sessions[key]=makeSession();db.sessions[key].template=JSON.parse(JSON.stringify(selectedCourse()));db.sessions[key].defaultRounds=selectedCourse().defaultRounds||0}db.view='roster';save();render()}
function home(){db.view='home';dashboardSection='';save();render()}
function tab(v){db.view=v;save();render()}
function chooseWeapon(w){dashboardSection='course';db.weapon=w;db.course='';save();render()}
function chooseCourse(c){db.course=c;save();render()}
function addShooter(){const s=current(),name=document.getElementById('newName').value.trim(),lane=document.getElementById('newLane').value,buttNumber=document.getElementById('newButtNumber').value.trim();if(!name)return alert('Enter a shooter name.');const p=makeShooter(name,lane===''?'':n(lane),n(s.defaultRounds),buttNumber);s.shooters.push(p);s.selected=p.id;save();render()}
function removeShooter(id){if(!confirm('Remove this shooter and their scores?'))return;const s=current();s.shooters=s.shooters.filter(p=>p.id!==id);if(s.selected===id)s.selected=s.shooters[0]?.id||'';save();render()}
function editShooter(id,k,v){const p=current().shooters.find(x=>x.id===id);if(!p)return;p[k]=['initial','extra','lane'].includes(k)?n(v):v;save();if(k==='lane'||k==='name'||k==='buttNumber')render();else refreshLive()}
function updateSession(k,v){current()[k]=k==='defaultRounds'?n(v):v;save()}
function applyRounds(){if(!confirm('Replace the initial ammunition count for all shooters in this course?'))return;const s=current();s.shooters.forEach(p=>p.initial=n(s.defaultRounds));save();render()}
function openShooter(id){current().selected=id;tab('score')}
function next(d){const s=current();if(!s.shooters.length)return;let i=s.shooters.findIndex(p=>p.id===s.selected);s.selected=s.shooters[(i+d+s.shooters.length)%s.shooters.length].id;save();render()}
function toggleRefire(checked){const p=shooter();if(!p)return;if(!checked&&Object.values(p.refireScores).some(o=>Object.values(o).some(v=>v!==''))&&!confirm('Hide the refire row? Existing refire scores will be preserved.')){render();return}p.refire=checked;save();render()}
function setScore(id,attempt,phase,field,v){const p=current().shooters.find(x=>x.id===id);if(!p)return;const dest=attempt==='initial'?p.initialScores:p.refireScores;if(!dest[phase])dest[phase]=blank();dest[phase][field]=n(v);save();refreshLive()}
function sumPhase(o){if(!o||['head','body','exterior'].some(k=>o[k]===''||o[k]==null))return '—';return ['head','body','exterior'].reduce((a,k)=>a+Number(o[k]),0)}
function progress(p){return tableList().filter(t=>{
 const rec=p.initialScores[t.id]||{};
 return t.areas.filter(a=>a.mode!=='sum').every(a=>(rec[a.id]??'')!=='');
}).length}
function total(p){return (Number(p.initial)||0)+(Number(p.extra)||0)}
function clearAll(){const s=current();if(!s)return;const ok=confirm('CLEAR ALL for '+db.weapon+' '+db.course+'?\n\nThis permanently deletes all shooters, lanes, scores, refires and ammunition for this course. Other courses will not be affected.');if(!ok)return;const sure=prompt('Type CLEAR to confirm:');if(sure!=='CLEAR')return;db.sessions[sid(db.weapon,db.course)]=makeSession();db.sessions[sid(db.weapon,db.course)].template=JSON.parse(JSON.stringify(selectedCourse()));db.sessions[sid(db.weapon,db.course)].defaultRounds=selectedCourse()?.defaultRounds||0;db.view='roster';save();render()}
function dashboard(){return `<h2 class="dashboard-title">Dashboard</h2><section class="dashboard-section"><button class="dashboard-card" onclick="toggleDashboardSection('weapon')"><span class="dash-icon">◎</span><span class="dash-copy"><strong>Select Weapon System</strong><small>${db.weapon?'Selected: '+safe(db.weapon):'Choose M18, M4A1, or another weapon.'}</small></span><span class="dash-chevron">›</span></button>${dashboardSection==='weapon'?`<div class="panel"><h2>Choose weapon system</h2><div class="weapons">${WEAPONS.map((w,i)=>`<button class="${db.weapon===w?'selected active':''}" onclick="chooseWeapon(WEAPONS[${i}])">${safe(w)}</button>`).join('')}</div></div>`:''}<button class="dashboard-card" onclick="toggleDashboardSection('course')"><span class="dash-icon">⊕</span><span class="dash-copy"><strong>Select Course</strong><small>${selectedCourse()?'Selected: '+safe(selectedCourse().name):'Choose and start a qualification course.'}</small></span><span class="dash-chevron">›</span></button>${dashboardSection==='course'?`<div class="panel"><h2>${db.weapon?safe(db.weapon)+' courses':'Select a weapon first'}</h2>${db.weapon?`<div class="courses">${availableCourses(db.weapon).map(c=>`<button class="${db.course===c.id?'selected active':''}" onclick="chooseCourse('${c.id}')">${safe(c.name)}</button>`).join('')||'<p class="muted">No courses assigned. Use Course Editor to assign one.</p>'}</div>${selectedCourse()?`<div class="dashboard-selection"><p class="muted">${safe(selectedCourse().notes)}</p><button class="primary dashboard-action" onclick="openCourse()">${db.sessions[sessionKey()]?'Continue':'Start'} ${safe(selectedCourse().name)} →</button></div>`:''}`:'<p class="muted">Select a weapon system above to see its courses.</p>'}</div>`:''}<button class="dashboard-card" onclick="tab('active')"><span class="dash-icon">♟</span><span class="dash-copy"><strong>Active Courses</strong><small>Open, manage, or delete saved classes (${Object.keys(db.sessions).length}).</small></span><span class="dash-chevron">›</span></button><button class="dashboard-card" onclick="tab('editor')"><span class="dash-icon">⚙</span><span class="dash-copy"><strong>Course Editor</strong><small>Create and manage reusable course templates.</small></span><span class="dash-chevron">›</span></button><button class="dashboard-card" onclick="tab('weapons')"><span class="dash-icon">✎</span><span class="dash-copy"><strong>Manage Weapon Systems</strong><small>Add or remove weapons available at this location.</small></span><span class="dash-chevron">›</span></button></section>`}
let dashboardSection='';
function toggleDashboardSection(section){dashboardSection=dashboardSection===section?'':section;render()}

function activeCourses(){return `<section class="panel"><div class="row between"><h2>Active Courses</h2><button onclick="home()">⌂ Dashboard</button></div><p class="muted">Manage saved class sessions. Deleting a class does not delete its course template.</p>${Object.entries(db.sessions).length?Object.entries(db.sessions).map(([k,s])=>`<div class="entry row between"><span><strong>${safe(k.split('|')[0])} • ${safe(s.template?.name||courseById(k.split('|')[1])?.name||'Legacy course')}</strong><div class="muted">${s.shooters.length} shooter(s) • ${safe(s.date||'Date not set')}</div></span><div class="row"><button class="primary" onclick="resume('${safe(k)}')">Open</button><button class="danger" onclick="deleteSession('${safe(k)}')" aria-label="Delete saved class">Delete</button></div></div>`).join(''):'<p class="muted">No active courses yet. Start a course from the dashboard.</p>'}</section>`}

function manageWeapons(){
 const used=w=>Object.entries(db.sessions).filter(([k])=>k.startsWith(w+'|')).length;
 return `<section class="panel"><div class="row between"><h2>Manage Weapon Systems</h2><button onclick="home()">⌂ Home</button></div><p class="muted">Choose which weapons are available at this location. Removing a weapon hides it from selection and the Course Editor, but does not delete saved classes or course templates.</p>
 ${WEAPONS.map((w,i)=>`<div class="entry row between"><div><strong>${safe(w)}</strong><div class="muted">${db.courses.filter(c=>c.weapons.includes(w)).length} assigned course templates • ${used(w)} saved classes</div></div><button class="danger" onclick="removeWeapon(${i})">Remove</button></div>`).join('')||'<p class="muted">No weapon systems configured.</p>'}
 <h3 style="margin-top:18px">Add Weapon System</h3><div class="row"><label style="flex:1">Weapon name<input id="newWeaponName" maxlength="70" placeholder="e.g., M249"></label><button class="primary" onclick="addWeapon()">+ Add</button></div><p class="muted">After adding a weapon, open Course Editor and assign existing or new course templates to it.</p></section>`;
}
function addWeapon(){
 const el=document.getElementById('newWeaponName');const name=el?.value.trim().replace(/\s+/g,' ');
 if(!name)return alert('Enter a weapon system name.');
 if(WEAPONS.some(w=>w.toLowerCase()===name.toLowerCase()))return alert('That weapon system already exists.');
 WEAPONS.push(name);save();render();
}
function removeWeapon(i){
 const name=WEAPONS[i];if(!name)return;
 const saved=Object.keys(db.sessions).filter(k=>k.startsWith(name+'|')).length;
 if(!confirm('Remove '+name+' from this location?'+(saved?'\n\n'+saved+' saved class(es) will be preserved under Active Courses.':'')+'\n\nCourse templates and scoring data will NOT be deleted.'))return;
 WEAPONS.splice(i,1);
 if(db.weapon===name){db.weapon='';db.course='';dashboardSection='';}
 save();render();
}

function editor(){return `<section class="panel"><div class="row between"><h2>Course Library</h2><div class="row"><button onclick="home()">⌂ Home</button><button class="primary" onclick="newCourse()">+ New Course</button></div></div><p class="muted">Templates are editable. M18 DQC (Preloaded) contains the DAFMAN scoring thresholds; other starter courses may contain placeholders. Changes affect new classes only.</p>${db.courses.map(c=>`<div class="entry"><div class="row between"><div><strong>${safe(c.name)}</strong><div class="muted">${c.weapons.map(safe).join(', ')||'No weapons assigned'} • ${c.phases.length} tables • v${c.version||1}</div></div><div class="row"><button onclick="editCourse('${c.id}')">Edit</button><button onclick="duplicateCourse('${c.id}')">Copy</button><button onclick="deleteCourse('${c.id}')">×</button></div></div></div>`).join('')}</section><section class="panel"><h3>Course library backup</h3><div class="row"><button onclick="exportLibrary()">Export templates</button><label style="flex:1">Import templates<input type="file" accept="application/json,.json" onchange="importLibrary(this.files[0])"></label></div><p class="muted">Save a backup to Files. Templates are stored on this device, not in GitHub.</p></section>`}
function newCourse(){const c={id:'c'+uid(),name:'New Course',weapons:[],phases:[normalizeTable({id:'p'+uid(),name:'Table 1',rounds:'',areas:[newArea('Scoring Area 1')]})],defaultRounds:0,notes:'Custom template',version:1};db.courses.push(c);db.editing=c.id;db.view='edit';save();render()}
function editCourse(id){db.editing=id;db.view='edit';save();render()}
function duplicateCourse(id){const c=courseById(id);if(!c)return;const d=JSON.parse(JSON.stringify(c));d.id='c'+uid();d.name=c.name+' Copy';d.version=1;db.courses.push(d);db.editing=d.id;db.view='edit';save();render()}
function deleteCourse(id){if(!confirm('Delete this course template from the library? Existing class scores will remain saved.'))return;db.courses=db.courses.filter(c=>c.id!==id);if(db.course===id)db.course='';db.view='editor';save();render()}
function updateTemplate(k,v){const c=courseById(db.editing);if(!c)return;c[k]=k==='defaultRounds'?n(v):v;c.version=(c.version||1)+1;save()}
function toggleWeapon(w,checked){const c=courseById(db.editing);if(!c)return;c.weapons=checked?[...new Set([...c.weapons,w])]:c.weapons.filter(x=>x!==w);c.version++;save()}
function updatePhase(id,k,v){const c=courseById(db.editing);const t=c?.phases.find(x=>x.id===id);if(!t)return;t[k]=k==='rounds'?(v===''?'':n(v)):v;c.version++;save()}
function addPhase(){const c=courseById(db.editing);if(!c)return;c.phases.push(normalizeTable({id:'p'+uid(),name:'Table '+(c.phases.length+1),rounds:'',areas:[newArea('Scoring Area 1')]}));c.version++;save();render()}
function removePhase(id){const c=courseById(db.editing);if(!c||c.phases.length===1)return alert('A course must have at least one table.');if(!confirm('Remove this table from the template?'))return;c.phases=c.phases.filter(x=>x.id!==id);c.version++;save();render()}
function editArea(tableId,areaId,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a[k]=['qual','expert'].includes(k)?(v===''?'':n(v)):v;if(k==='mode'&&v==='sum'&&!a.sources)a.sources=[];c.version++;save();if(k==='mode')render()}
function addArea(tableId){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;t.areas.push(newArea('Scoreable Area '+(t.areas.length+1)));c.version++;save();render()}
function removeArea(tableId,areaId){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t||t.areas.length===1)return alert('Keep at least one scoring area.');if(!confirm('Remove this scoreable area?'))return;t.areas=t.areas.filter(x=>x.id!==areaId);t.areas.forEach(a=>a.sources=(a.sources||[]).filter(x=>x!==areaId));c.version++;save();render()}
function toggleSource(tableId,areaId,sourceId,checked){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a.sources=checked?[...new Set([...(a.sources||[]),sourceId])]:(a.sources||[]).filter(x=>x!==sourceId);c.version++;save()}
function toggleAreaCount(tableId,areaId,k,checked){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId),a=t?.areas.find(x=>x.id===areaId);if(!a)return;a[k]=checked;c.version++;save()}
function setTableTime(tableId,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;t.time[k]=k==='seconds'?(v===''?'':n(v)):v;c.version++;save();if(k==='enabled')render()}
function addScoringPhase(tableId){
 const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;
 t.scoringPhases.push({id:'sp'+uid(),name:'Phase '+(t.scoringPhases.length+1),time:{enabled:false,seconds:''},areas:[newArea('Scoring Area 1')]});
 c.version++;save();render();
}
function removeScoringPhase(tableId,phaseId){
 const c=courseById(db.editing),t=c?.phases.find(x=>x.id===tableId);if(!t)return;
 if(t.scoringPhases.length<2)return alert('Keep at least one Phase per Table.');
 if(!confirm('Remove this Phase and its scoring fields?'))return;
 t.scoringPhases=t.scoringPhases.filter(p=>p.id!==phaseId);c.version++;save();render();
}
function editScoringPhase(tableId,phaseId,name){
 const c=courseById(db.editing),ph=c?.phases.find(t=>t.id===tableId)?.scoringPhases.find(p=>p.id===phaseId);
 if(ph){ph.name=name;c.version++;save()}
}
function setPhaseTime(tableId,phaseId,k,v){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId);if(!ph)return;
 if(!ph.time)ph.time={enabled:false,seconds:''};
 ph.time[k]=k==='seconds'?(v===''?'':n(v)):v;c.version++;save();if(k==='enabled')render();
}
function findEditorPhase(tableId,phaseId){
 return courseById(db.editing)?.phases.find(t=>t.id===tableId)?.scoringPhases.find(p=>p.id===phaseId);
}
function editScoringArea(tableId,phaseId,areaId,k,v){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId),a=ph?.areas.find(x=>x.id===areaId);if(!a)return;
 a[k]=['qual','expert'].includes(k)?(v===''?'':n(v)):v;
 if(k==='mode'&&v==='sum')a.sources=a.sources||[];
 c.version++;save();if(k==='mode')render();
}
function addScoringArea(tableId,phaseId){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId);if(!ph)return;
 ph.areas.push(newArea('Scoring Area '+(ph.areas.length+1)));c.version++;save();render();
}
function removeScoringArea(tableId,phaseId,areaId){
 const c=courseById(db.editing),ph=findEditorPhase(tableId,phaseId);if(!ph)return;
 if(ph.areas.length<2)return alert('Keep at least one scoring area.');
 ph.areas=ph.areas.filter(a=>a.id!==areaId);
 ph.areas.forEach(a=>a.sources=(a.sources||[]).filter(id=>id!==areaId));
 c.version++;save();render();
}
function setScoringAreaCount(tableId,phaseId,areaId,checked){
 const c=courseById(db.editing),a=findEditorPhase(tableId,phaseId)?.areas.find(a=>a.id===areaId);
 if(a){a.countScore=checked;c.version++;save()}
}
function setScoringSource(tableId,phaseId,areaId,sourceId,checked){
 const c=courseById(db.editing),a=findEditorPhase(tableId,phaseId)?.areas.find(a=>a.id===areaId);
 if(a){a.sources=checked?[...new Set([...(a.sources||[]),sourceId])]:(a.sources||[]).filter(id=>id!==sourceId);c.version++;save()}
}
function updateTableRule(id,k,v){const c=courseById(db.editing),t=c?.phases.find(x=>x.id===id);if(!t)return;t[k]=v===''?'':n(v);c.version++;save()}
function editForm(){
 const c=courseById(db.editing);if(!c)return editor();
 return `<section class="panel"><div class="row between"><h2>Course Editor</h2><button onclick="tab('editor')">Done ✓</button></div>
 <label>Course name<input value="${attr(c.name)}" onchange="updateTemplate('name',this.value)"></label>
 <p class="muted">Available for these weapons:</p><div class="grid">${WEAPONS.map((w,i)=>`<label class="row" style="display:flex"><input type="checkbox" style="width:20px" ${c.weapons.includes(w)?'checked':''} onchange="toggleWeapon(WEAPONS[${i}],this.checked)">${safe(w)}</label>`).join('')}</div>
 <label>Default ammunition<input type="number" min="0" value="${c.defaultRounds||0}" onchange="updateTemplate('defaultRounds',this.value)"></label></section>
 ${c.phases.map(t=>`<section class="panel"><div class="row between"><h2>Firing Table: ${safe(t.name)}</h2><button onclick="removePhase('${t.id}')">Remove Table</button></div>
 <div class="grid"><label>Firing Table name<input value="${attr(t.name)}" onchange="updatePhase('${t.id}','name',this.value)"></label>
 <label>Rounds fired<input type="number" min="0" value="${attr(t.rounds)}" onchange="updatePhase('${t.id}','rounds',this.value)"></label>
 <label>Minimum qualifying hits (Table)<input type="number" min="0" placeholder="Optional" value="${attr(t.qualMin)}" onchange="updateTableRule('${t.id}','qualMin',this.value)"></label>
 <label>Minimum Expert qualifying hits (Table)<input type="number" min="0" placeholder="Optional" value="${attr(t.expertTotal)}" onchange="updateTableRule('${t.id}','expertTotal',this.value)"></label></div>
 <p class="muted">Score the target once after the entire Table. Qualifying Hits counts checked manual areas; Total Hits on Paper counts all manual areas. Do not create overlapping manual areas.</p>
 <h3>Editable Scoreable Areas</h3>
 ${t.areas.map(a=>`<div class="areaedit"><div class="row between"><strong>${safe(a.name)}</strong><button onclick="removeArea('${t.id}','${a.id}')">×</button></div>
 <div class="grid"><label>Scoreable area name<input value="${attr(a.name)}" onchange="editArea('${t.id}','${a.id}','name',this.value)"></label>
 <label>Entry type<select onchange="editArea('${t.id}','${a.id}','mode',this.value)"><option value="manual" ${a.mode!=='sum'?'selected':''}>Manual hits</option><option value="sum" ${a.mode==='sum'?'selected':''}>Calculated Total</option></select></label>
 <label>Minimum qualifying hits (area)<input type="number" min="0" placeholder="Optional" value="${attr(a.qual)}" onchange="editArea('${t.id}','${a.id}','qual',this.value)"></label>
 <label>Minimum Expert hits (area)<input type="number" min="0" placeholder="Optional" value="${attr(a.expert)}" onchange="editArea('${t.id}','${a.id}','expert',this.value)"></label></div>
 ${a.mode!=='sum'?`<label class="row" style="display:flex;margin-top:10px"><input type="checkbox" style="width:20px" ${a.countScore?'checked':''} onchange="toggleAreaCount('${t.id}','${a.id}','countScore',this.checked)"> Include in Qualifying Hits</label>`:
 `<p class="muted">Add these manual areas:</p>${t.areas.filter(x=>x.id!==a.id&&x.mode!=='sum').map(x=>`<label class="row" style="display:flex"><input type="checkbox" style="width:20px" ${(a.sources||[]).includes(x.id)?'checked':''} onchange="toggleSource('${t.id}','${a.id}','${x.id}',this.checked)">${safe(x.name)}</label>`).join('')}`}
 </div>`).join('')}
 <button onclick="addArea('${t.id}')">+ Add Scoreable Area</button></section>`).join('')}
 <section class="panel"><button class="primary" onclick="addPhase()">+ Add Table</button><p><button onclick="tab('editor')">Save and return to library</button></p><p class="muted">Saved automatically. Existing class sessions keep their original course snapshot.</p></section>`;
}
function exportLibrary(){const blob=new Blob([JSON.stringify({type:'catm-course-library',version:1,courses:db.courses},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='catm-course-library.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importLibrary(file){if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.type!=='catm-course-library'||!Array.isArray(obj.courses)||!obj.courses.every(c=>typeof c.id==='string'&&typeof c.name==='string'&&Array.isArray(c.weapons)&&Array.isArray(c.phases)&&c.phases.length))throw Error('Not a valid CATM course library');if(!confirm('Replace all saved course templates with this backup? Existing class scores will remain unchanged.'))return;db.courses=obj.courses.map(normalizeCourse);db.course='';save();render();alert('Templates imported successfully.')}catch(e){alert('Import failed: '+e.message)}}

function deleteSession(key){
 const s=db.sessions[key];if(!s)return;
 const label=(s.template?.name||'Saved class')+' ('+key.split('|')[0]+')';
 if(!confirm('Delete saved class: '+label+'?\n\nThis permanently deletes all shooters, scores, refires, and ammunition for this class. The reusable course template and other saved classes will not be affected.'))return;
 if(prompt('Type DELETE to permanently remove this saved class:')!=='DELETE')return;
 delete db.sessions[key];
 if(sessionKey()===key){db.course='';}
 db.view='active';save();render();
}
function completeCourse(){
 const key=sessionKey(),session=current();
 if(!session)return alert('No active class is open.');
 const name=session.template?.name||selectedCourse()?.name||'Course';
 if(!confirm('Complete and remove this class?\\n\\n'+name+' ('+db.weapon+')\\n'+session.shooters.length+' shooter(s)\\n\\nThis permanently deletes the saved class, including all scores, shooters, refires and ammunition records. Course templates and other classes are preserved.'))return;
 delete db.sessions[key];
 db.weapon='';db.course='';db.view='home';
 save();render();
}
function resume(key){const i=key.indexOf('|');db.weapon=key.slice(0,i);db.course=key.slice(i+1);openCourse()}
function roster(){const s=current();return `<section class="panel"><div class="row between"><h2>${safe(db.weapon)} • ${safe(current()?.template?.name||selectedCourse()?.name||db.course)}</h2><span class="tag">CLASS ROSTER</span></div><div class="grid"><label>Class date<input type="date" value="${safe(s.date)}" onchange="updateSession('date',this.value)"></label><label>Default initial rounds<input type="number" min="0" value="${s.defaultRounds}" onchange="updateSession('defaultRounds',this.value)"></label></div><p><button onclick="applyRounds()">Apply rounds to all</button></p><div class="notice">Course names and ammunition defaults may be placeholders. Table status reflects configured minimums only; verify official qualification and refire rules.</div></section><section class="panel"><h2>Class shooters (${s.shooters.length})</h2>${s.shooters.map(p=>`<div class="entry row between"><div><strong>${safe(p.name)}</strong><div class="muted">Lane ${safe(p.lane||'Unassigned')} • Butt # ${safe(p.buttNumber||'—')} • ${progress(p)}/${tableList().length} Tables completed • ${total(p)} rounds</div></div><div class="row"><button class="primary" onclick="openShooter('${p.id}')">Score</button><button onclick="removeShooter('${p.id}')" aria-label="Remove shooter">×</button></div></div>`).join('')||'<p class="muted">No shooters yet. Add a fictional shooter below.</p>'}<h3 style="margin-top:17px">Add shooter</h3><div class="grid"><label>Name<input id="newName" placeholder="Fictional name"></label><label>Lane<input id="newLane" type="number" min="1" placeholder="Lane number"></label><label>Weapon Butt # (optional)<input id="newButtNumber" type="text" placeholder="e.g., 12" autocomplete="off"></label></div><p><button class="primary" onclick="addShooter()">Add shooter</button></p></section>`}
function phaseCell(p,attempt,phase){const obj=(attempt==='initial'?p.initialScores:p.refireScores)[phase]||blank();return `<td>${['head','body','exterior'].map(k=>`<label class="cellfield"><span>${k==='exterior'?'Exterior':k==='head'?'Head':'Body'}</span><input type="number" min="0" inputmode="numeric" placeholder="—" value="${safe(obj[k])}" oninput="setScore('${p.id}','${attempt}','${phase}','${k}',this.value)"></label>`).join('')}<div class="overall"><strong>Overall</strong><strong id="sum-${attempt}-${phase.replace(' ','')}">${sumPhase(obj)}</strong></div></td>`}

let scoreTableIndex=0;
function changeScoringTable(delta){
  const tables=tableList();
  if(!tables.length)return;
  scoreTableIndex=Math.max(0,Math.min(tables.length-1,scoreTableIndex+delta));
  render();
  document.getElementById('app')?.scrollIntoView({block:'start'});
}
function initiateRemedialRow(id){
  const p=current()?.shooters.find(x=>x.id===id);
  if(!p)return;
  if(tableList().some(t=>tableStatus(p,'initial',t)==='Incomplete')){
    alert('Enter all initial Firing Table scores for this shooter before initiating remedial.');
    return;
  }
  const failed=tableList().filter(t=>tableStatus(p,'initial',t)==='Fail');
  if(!failed.length){alert('No failed Firing Tables require remedial scoring.');return;}
  p.remedialInitiated=true;
  save();
  render();
}
function refreshScoringTable(){
  const t=tableList()[scoreTableIndex];
  if(!t||db.view!=='score')return;
  const shooters=current()?.shooters||[];
  for(const row of document.querySelectorAll('.scorer-card[data-shooter-id]')){
    const p=shooters.find(x=>x.id===row.dataset.shooterId);
    if(!p)continue;
    const setText=(selector,value)=>{const e=row.querySelector(selector);if(e)e.textContent=value;};
    for(const attempt of ['initial','refire']){
      const record=attemptRecord(p,attempt,t);
      for(const a of t.areas){
        const e=[...row.querySelectorAll('[data-score-calc]')].find(el=>el.dataset.scoreCalc===attempt+'|'+a.id);
        if(e){const value=areaValue(record,t,a);e.textContent=value===''?'—':value;}
      }
      const totals=scoreTotals(record,t);
      const status=tableStatus(p,attempt,t);
      setText('[data-'+attempt+'-status]',status);
      setText('[data-'+attempt+'-hits]',totals.qualifying===''?'—':totals.qualifying);
    }
    const initial=tableStatus(p,'initial',t);
    const overall=overallStatus(p);
    const value=effectivePaperTotal(p);
    setText('[data-effective-status]',effectiveTableStatus(p,t));
    setText('[data-overall-status]',overall);
    setText('[data-overall-score]',value===''?'—':value);
    const btn=row.querySelector('[data-initiate-remedial]');
    if(btn&&!remedialActive(p)){
      const eligible=tableList().some(table=>tableStatus(p,'initial',table)==='Fail');
      btn.disabled=!eligible;
      btn.title=eligible?'Start remedial scoring after initial tables are complete':'No failed initial tables';
    }
    const statusEl=row.querySelector('[data-initial-status]');
    if(statusEl)statusEl.className='scorer-status '+(initial==='Fail'?'status-fail':initial==='Incomplete'?'status-pending':'status-pass');
    const refireDisplay=row.querySelector('[data-refire-display]');
    if(refireDisplay)refireDisplay.textContent=tableStatus(p,'refire',t);
  }
  const complete=shooters.filter(p=>tableStatus(p,'initial',t)!=='Incomplete').length;
  const passing=shooters.filter(p=>['Qualified','Expert'].includes(effectiveTableStatus(p,t))).length;
  const done=document.querySelector('[data-class-completed]'),passed=document.querySelector('[data-class-passed]');
  if(done)done.textContent=complete;
  if(passed)passed.textContent=passing;
}

const refireOpenIds=new Set();
function setScoringRefireOpen(id,isOpen){
 if(isOpen)refireOpenIds.add(id);else refireOpenIds.delete(id);
}
function score(){
 const session=current(),tables=tableList();
 if(!session)return '<section class="panel"><h2>No active course</h2></section>';
 if(!session.shooters.length)return `<section class="panel"><h2>No shooters</h2><p>Add shooters before scoring.</p><button class="primary" onclick="tab('roster')">Go to Shooters</button></section>`;
 if(!tables.length)return '<section class="panel">No Firing Tables configured.</section>';
 scoreTableIndex=Math.min(Math.max(0,scoreTableIndex),tables.length-1);
 const t=tables[scoreTableIndex];
 const shooters=[...session.shooters].sort((a,b)=>(Number(a.lane)||999)-(Number(b.lane)||999)||a.name.localeCompare(b.name));
 const initials=shooters.filter(p=>tableStatus(p,'initial',t)!=='Incomplete').length;
 const passed=shooters.filter(p=>['Qualified','Expert'].includes(effectiveTableStatus(p,t))).length;
 const areaCount=t.areas.length;
 const mobileCols=Math.min(4,Math.max(1,areaCount));
 const shortArea=name=>{const x=String(name||'Score').trim();const map=[[/hits? on paper|paper hits?/i,'Paper'],[/head/i,'Head'],[/body/i,'Body'],[/exterior/i,'Outer'],[/qualif/i,'Qual'],[/expert/i,'Expert'],[/total/i,'Total'],[/points?/i,'Pts'],[/rounds?/i,'Rds'],[/time/i,'Time']];for(const [re,label] of map)if(re.test(x))return label;return x.length>10?x.slice(0,9).trim()+'…':x;};
 const columnWidth=`grid-template-columns: minmax(152px,1.7fr) 55px 64px ${t.areas.map(()=>'minmax(78px,1fr)').join(' ')} 70px 112px 96px;`;
 const minWidth=Math.max(790,550+areaCount*94);
 const nav=()=>`<div class="score-nav score-nav-compact"><button type="button" onclick="changeScoringTable(-1)" ${scoreTableIndex===0?'disabled':''}>← Previous</button><span>${scoreTableIndex+1} / ${tables.length}</span><button type="button" class="primary" onclick="changeScoringTable(1)" ${scoreTableIndex===tables.length-1?'disabled':''}>Next →</button></div>`;
 const badge=status=>`<span class="scorer-status ${status==='Fail'?'status-fail':status==='Incomplete'?'status-pending':'status-pass'}" data-initial-status>${safe(status)}</span>`;
 const input=(p,attempt,a)=>{
  const record=attemptRecord(p,attempt,t),value=areaValue(record,t,a);
  if(a.mode==='sum')return `<output class="grid-calc" data-score-calc="${safe(attempt+'|'+a.id)}">${value===''?'—':value}</output>`;
  return `<input class="grid-score-input" type="number" min="0" step="1" inputmode="numeric" aria-label="${safe(p.name+' '+a.name+' '+attempt)}" placeholder="—" value="${safe(record[a.id]??'')}" oninput="setAreaScore('${p.id}','${attempt}','${t.id}','${a.id}',this.value)">`;
 };
 const row=p=>{
  const initial=tableStatus(p,'initial',t);
  const final=effectiveTableStatus(p,t);
  const hits=scoreTotals(attemptRecord(p,'initial',t),t).qualifying;
  const totalScore=effectivePaperTotal(p);
  const eligible=refireEligible(p,t);
  const active=remedialActive(p);
  const failAny=tables.some(x=>tableStatus(p,'initial',x)==='Fail');
  const refireTotal=scoreTotals(attemptRecord(p,'refire',t),t).qualifying;
  const rowMarkup=`<div class="score-grid-row" style="${columnWidth}--mobile-score-columns:${mobileCols};" role="row">
    <div class="grid-shooter" role="cell"><strong>${safe(p.name)}</strong><small>Lane ${safe(p.lane||'—')} · Ammo ${total(p)}</small></div>
    <div class="grid-cell grid-metadata" role="cell">${safe(p.lane||'—')}</div>
    <div class="grid-cell grid-metadata grid-butt" role="cell">${safe(p.buttNumber||'—')}</div>
    ${t.areas.map(a=>`<div class="grid-cell grid-input-cell" role="cell"><span class="mobile-score-label" title="${safe(a.name)}">${safe(shortArea(a.name))}</span>${input(p,'initial',a)}</div>`).join('')}
    <div class="grid-cell grid-hits" role="cell"><strong data-initial-hits>${hits===''?'—':hits}</strong></div>
    <div class="grid-cell grid-result" role="cell">${badge(initial)}<small data-effective-status>${safe(final)}</small></div>
    <div class="grid-cell grid-overall" role="cell"><strong data-overall-score>${totalScore===''?'—':totalScore}</strong><small data-overall-status>${safe(overallStatus(p))}</small></div>
   </div>`;
  const remedial=eligible?`<details class="grid-refire" ${refireOpenIds.has(p.id)?'open':''} ontoggle="setScoringRefireOpen('${p.id}',this.open)">
    <summary> <span>↳ Re-Fire · ${safe(p.name)}</span> <span data-refire-status>${safe(tableStatus(p,'refire',t))}</span> </summary>
    <div class="refire-grid-scroll"><div class="score-grid-row score-refire-row" role="row" style="${columnWidth}--mobile-score-columns:${mobileCols};min-width:${minWidth}px">
     <div class="grid-shooter" role="cell"><strong>Re-Fire</strong><small>${safe(p.name)}</small></div>
     <div class="grid-cell grid-metadata">${safe(p.lane||'—')}</div>
     <div class="grid-cell grid-metadata grid-butt">${safe(p.buttNumber||'—')}</div>
     ${t.areas.map(a=>`<div class="grid-cell grid-input-cell"><span class="mobile-score-label" title="${safe(a.name)}">${safe(shortArea(a.name))}</span>${input(p,'refire',a)}</div>`).join('')}
     <div class="grid-cell grid-hits"><strong data-refire-hits>${refireTotal===''?'—':refireTotal}</strong></div>
     <div class="grid-cell grid-result" data-refire-display>${safe(tableStatus(p,'refire',t))}</div>
     <div class="grid-cell grid-overall">Remedial</div>
    </div></div>
   </details>`:(!active?`<div class="grid-remedial-bar"><span>${initial==='Fail'?'Failed initial score. Remedial requires manual initiation.':' '}</span><button type="button" data-initiate-remedial onclick="initiateRemedialRow('${p.id}')" ${failAny?'':'disabled'}>Initiate Remedial</button></div>`:'');
  return `<div class="scorer-card score-grid-shooter-group" data-shooter-id="${safe(p.id)}" role="rowgroup" style="--mobile-score-columns:${mobileCols}">${rowMarkup}${remedial}</div>`;
 };
 return `<section class="panel score-section score-grid-header">
 <div class="score-head"><div><h2>Score</h2><p class="muted">${safe(db.weapon)} · ${safe(session.template?.name||db.course)} · ${safe(session.date)}</p></div><span class="tag">CLASS SCORING</span></div>
 <div class="score-toolbar"><label class="score-table-choose">Firing Table<select onchange="scoreTableIndex=Number(this.value);render()">${tables.map((x,i)=>`<option value="${i}" ${i===scoreTableIndex?'selected':''}>${safe(x.name)}</option>`).join('')}</select></label>${nav()}</div>
 <div class="class-score-stats"><div><b>${shooters.length}</b><span>Shooters</span></div><div><b data-class-completed>${initials}</b><span>Scored</span></div><div><b data-class-passed>${passed}</b><span>Passing</span></div><div class="class-auto-save"><span class="live-save-dot"></span> Scores save automatically</div></div>
 </section>
 <section class="panel score-grid-panel"><div class="score-grid-title"><div><strong>${safe(t.name)}</strong><small>Firing Table ${scoreTableIndex+1} · ${safe(t.rounds===''?'Rounds not set':t.rounds+' rounds')}</small></div><span>${shooters.length} shooters</span></div>
 <div class="score-grid-scroll" role="table" aria-label="${safe(t.name+' class scoring')}" style="--score-min-width:${minWidth}px">
 <div class="score-grid-columns" style="${columnWidth}--mobile-score-columns:${mobileCols};" role="row"><div role="columnheader">Shooter</div><div role="columnheader">Lane</div><div role="columnheader">Butt #</div>${t.areas.map(a=>`<div role="columnheader">${safe(a.name)}</div>`).join('')}<div role="columnheader">Hits</div><div role="columnheader">Table Status</div><div role="columnheader">Total / Overall</div></div>
 ${shooters.map(row).join('')}
 </div>
 <div class="score-grid-caption">Each shooter stays on a separate line. Additional scoring areas wrap to fit your screen.</div>
 </section>
 <section class="panel score-bottom score-grid-bottom">${nav()}<p class="muted">Only manually initiated remedial scores are entered in Re-Fire. Initial scores remain on record.</p></section>`;
}

// Compact operational summary; detailed scoring remains in stored shooter records.
function reportResult(status){
 if(status==='Qualified'||status==='Expert'||status==='Pass')return 'PASS';
 if(status==='Fail')return 'FAIL';
 return 'INCOMPLETE';
}
function reportTableResult(p,t){
 const value=reportResult(effectiveTableStatus(p,t));
 const usedRefire=refireEligible(p,t)&&tableStatus(p,'refire',t)!=='Incomplete';
 return usedRefire&&value==='PASS'?'PASS (R)':value;
}
function exportRows(){
 const session=current(),tables=tableList();
 const headers=['Name','Lane','Butt #','Ammo',...tables.map(t=>t.name),'Total Score','Overall'];
 const rows=session.shooters.map(p=>[
  p.name,p.lane??'',p.buttNumber||'',total(p),
  ...tables.map(t=>reportTableResult(p,t)),
  effectivePaperTotal(p)===''?'':effectivePaperTotal(p),reportResult(overallStatus(p))
 ]);
 return {headers,rows};
}
function reportCounts(){
 const shooters=current().shooters;
 const passed=shooters.filter(p=>reportResult(overallStatus(p))==='PASS').length;
 const failed=shooters.filter(p=>reportResult(overallStatus(p))==='FAIL').length;
 return {count:shooters.length,passed,failed,incomplete:shooters.length-passed-failed};
}
function reportHTML(){
 const {headers,rows}=exportRows(),stats=reportCounts(),session=current();
 const rate=stats.count?Math.round(stats.passed/stats.count*100):0;
 const header=`<div class="report-heading"><h2>RangeTrack | CATM Qualification Report</h2><p><strong>${safe(db.weapon)} • ${safe(session.template?.name||db.course)}</strong> &nbsp; | &nbsp; ${safe(session.date||'—')}</p><p>Class Summary &nbsp; | &nbsp; Shooters: <strong>${stats.count}</strong> &nbsp; Passed: <strong>${stats.passed}</strong> &nbsp; Failed: <strong>${stats.failed}</strong> &nbsp; Incomplete: <strong>${stats.incomplete}</strong> &nbsp; Pass Rate: <strong>${rate}%</strong></p></div>`;
 const cols=`<thead><tr><th>#</th>${headers.map(h=>`<th>${safe(h)}</th>`).join('')}</tr></thead>`;
 const body=rows.map((row,i)=>`<tr><td data-label="#">${i+1}</td>${row.map((value,j)=>{const v=value===''?'—':value;const cls=(j>=4&&j!==headers.length-2)?(String(v).startsWith('PASS')?' result-pass':String(v)==='FAIL'?' result-fail':''):'';return `<td data-label="${safe(headers[j])}" class="${cls}">${safe(v)}</td>`}).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length+1}">No shooters added.</td></tr>`;
 return `${header}<div class="report-table-wrap"><table class="report-table">${cols}<tbody>${body}</tbody></table></div><p class="report-note">(R) indicates a successful remedial attempt. Ammunition includes additional rounds. Scores reflect the final effective attempt for each table.</p>`;
}
function reportFilename(ext){
 const s=current();const name=(db.weapon+'_'+(s.template?.name||db.course)+'_'+(s.date||'class')).replace(/[^a-z0-9_-]+/gi,'_').replace(/_+/g,'_').slice(0,95);
 return 'RangeTrack_'+name+'.'+ext;
}
function exportExcel(){
 const {headers,rows}=exportRows();
 // UTF-8 BOM improves Excel handling of names and symbols; quoted CSV preserves commas and line breaks.
 const csv=[headers,...rows].map(row=>row.map(value=>{
  let v=String(value??'');
  // Prevent spreadsheet formula execution for untrusted names and editable labels.
  if(/^[\s]*[=+@-]/.test(v))v="'"+v;
  return '"'+v.replace(/"/g,'""')+'"';
 }).join(',')).join('\r\n');
 const blob=new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=reportFilename('csv');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportPDF(){
 // Print preview lives on the existing page so mobile Safari does not block popups.
 const main=document.getElementById('app');if(!main)return;
 const nav=document.getElementById('nav');
 nav.innerHTML='';
 main.innerHTML=`<section class="export-controls panel"><button onclick="closePrintReport()">← Back to Totals</button> <button class="primary" onclick="window.print()">Print / Save as PDF</button><p class="muted">On iPhone, use Print and save or share the PDF from the print preview.</p></section><div id="printReport">${reportHTML()}<p class="export-footer">Generated by RangeTrack. Verify results against applicable qualification requirements before official use.</p></div>`;
 window.__rangeTrackPrintRestore=()=>render();
}
function closePrintReport(){if(window.__rangeTrackPrintRestore){window.__rangeTrackPrintRestore();window.__rangeTrackPrintRestore=null;}else render();}

function totals(){const s=current();return `<section class="panel"><h2>Course totals</h2><p style="font-size:30px;margin:0"><strong>${s.shooters.reduce((a,p)=>a+total(p),0)}</strong> <span class="muted">rounds</span></p><p class="muted">${s.shooters.length} shooters • ${safe(db.weapon)} ${safe(db.course)} • ${safe(s.date)}</p></section><section class="panel"><h2>Shooter progress</h2>${s.shooters.map(p=>`<div class="entry row between"><div><strong>${safe(p.name)}</strong><div class="muted">Lane ${safe(p.lane||'—')} • Butt # ${safe(p.buttNumber||'—')} • ${progress(p)}/${tableList().length} initial Tables • Failed initial Tables: ${tableList().filter(t=>tableStatus(p,'initial',t)==='Fail').length} • Remedial: ${remedialActive(p)?'Initiated':'Not initiated'}</div></div><strong>${total(p)} rds</strong></div>`).join('')||'<p class="muted">No shooters added.</p>'}</section><section class="panel"><h2>Class Qualification Report</h2><div class="report-preview">${reportHTML()}</div></section><section class="panel"><h2>Export Results</h2><p class="muted">Export the class summary with shooter, lane, butt number, ammunition, each Firing Table result, total score, and overall result. Detailed scoring remains available in each shooter’s record.</p><div class="row"><button class="primary" onclick="exportExcel()">Export to Excel (CSV)</button><button class="primary" onclick="exportPDF()">Export to PDF</button></div></section><section class="panel dangerarea"><h2>Complete Course</h2><p class="muted">Finished with this class? Remove it from Active Courses and return to the dashboard. This permanently deletes its shooter records and scores, so export or record any results you need before continuing.</p><button class="danger" onclick="completeCourse()">Complete Course</button></section><section class="panel dangerarea"><h2>Reset this class</h2><p class="muted">Deletes all shooters, lane assignments, scores, refires and ammunition for this weapon/course only. Other course sessions remain saved.</p><button class="danger" onclick="clearAll()">Clear All</button></section>`}
function refreshLive(){
 const p=shooter();if(!p)return;
 const r=document.getElementById('roundTotal');if(r)r.textContent='Total ammunition: '+total(p)+' rounds';
 const x=document.getElementById('scoreProgress');if(x)x.textContent=progress(p)+'/'+tableList().length+' Tables completed';
 for(const t of tableList())for(const at of ['initial','refire']){
 const rec=attemptRecord(p,at,t);
 for(const a of t.areas){const e=document.querySelector(`[data-calc="${at}-${t.id}-${a.id}"]`);if(e){const v=areaValue(rec,t,a);e.textContent=v===''?'—':v}}
 const sums=scoreTotals(rec,t);
 for(const [key,val] of [['qual-total',sums.qualifying],['paper-total',sums.paper]]){const e=document.querySelector(`[data-${key}="${at}-${t.id}"]`);if(e)e.textContent=val===''?'—':val}
 const st=document.querySelector(`[data-status="${at}-${t.id}"]`);if(st)st.textContent=tableStatus(p,at,t);
 const ex=document.querySelector(`[data-expert="${at}-${t.id}"]`);if(ex)ex.textContent=evaluateExpert(p,at,t)?'Expert':'—';
 }
 const coursePaper=document.querySelector('[data-course-paper="initial"]');if(coursePaper){const value=effectivePaperTotal(p);coursePaper.textContent=value===''?'—':value;}
 const courseStatus=document.querySelector('[data-course-status]');if(courseStatus)courseStatus.textContent=overallStatus(p);
}
function render(){const isHome=db.view==='home'||((db.view!=='editor'&&db.view!=='edit'&&db.view!=='active'&&db.view!=='weapons')&&!current());document.getElementById('nav').innerHTML=(isHome||db.view==='editor'||db.view==='edit'||db.view==='active'||db.view==='weapons')?'':`<button onclick="home()">⌂ Home</button><button class="${db.view==='roster'?'active':''}" onclick="tab('roster')">Shooters</button><button class="${db.view==='score'?'active':''}" onclick="tab('score')">Score</button><button class="${db.view==='totals'?'active':''}" onclick="tab('totals')">Totals</button>`;document.getElementById('app').innerHTML=db.view==='editor'?editor():db.view==='edit'?editForm():db.view==='active'?activeCourses():db.view==='weapons'?manageWeapons():isHome?dashboard():({roster,score,totals}[db.view]||roster)()}
render();
</script></body></html>
